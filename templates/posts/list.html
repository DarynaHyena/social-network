{% extends 'base.html' %}
{% block title %}
Домашня сторінка
{% endblock %}



{% block content %}

{% for post in posts %}
<div class="list-group my-2">
      <a href="{% url 'post-detail' post.pk %}" class="list-group-item list-group-item-action">{{ post.title }}
      <span class="badge rounded-pill text-bg-primary">{{ post.author }}</span>
      <span class="badge rounded-pill text-bg-info">{{ post.community }}</span>
      </a>
    </div>
{% endfor %}

{% endblock %}
