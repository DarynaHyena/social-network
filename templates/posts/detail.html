{% extends 'base.html' %}

{% block title %}
Дорис {{ post.title }}
{% endblock %}

{% block content %}
<div class="card" style="max-width: 320px;">
  <div class="d-flex w-100 justify-content-between">
      <h4 class="card-title">{{ post.title }}</h4>
      <small>{{ post.created_at }}</small>
    </div>
  <div class="card-body">
    <p class="card-text">{{ post.content }}</p>
    <div class="row">
      <div class="col">
        <p class="card-subtitle fg-3">{{ post.author }}</p>
      </div>

      <div class="col">
        <p class="card-subtitle fg-3">{{ post.community }}</p>
      </div>
    </div>
    <a href="#">Card link</a>
  </div>
</div>
{% endblock %}
