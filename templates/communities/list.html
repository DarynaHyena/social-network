{% extends 'base.html' %}
{% block title %}
Спільноти
{% endblock %}

{% block content %}

<h2>Наші спільноти</h2>
<hr>
<a href="{% url 'community-create' %}" type="button" class="btn-solid theme-inverse">Створити нову спільноту</a>
<hr>
{% for community in communities %}
<div class="card" style="width: 18rem;">
  <div class="card-body">
    <img src="{{ community.media.url }}" class="card-img" alt="Зображення спільноти">
    <a class="btn-text theme-inverse text-decoration-none" href="{% url 'community-detail' community.pk %}">Назва: {{ community.name }}</a>
    <p class="card-text fg-2">Опис: {{ community.description }}</p>
    <small class="fg-3">Last updated {{ community.updated_at }}</small>
  </div>
</div>
{% endfor %}

{% endblock %}
