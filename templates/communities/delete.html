{% extends 'base.html' %}
{% block title %}
Видалення спільноти {{ community.name }}
{% endblock %}


{% block content %}
<div class="container">
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-outline-success">Видалити</button>
    <a href="{% url 'community-detail' community.pk %}" class="btn btn-secondary">Назад до спільноти</a>
  </form>
</div>
{% endblock %}
